version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Keep routine Minitest updates on the 5.x line declared in the Gemfile.
      - dependency-name: minitest
        update-types:
          - "version-update:semver-major"
    groups:
      ruby-patches:
        update-types:
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
